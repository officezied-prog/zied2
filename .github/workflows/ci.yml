name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and API tests
        run: npm test
      - name: n8n workflow validation
        run: node n8n/validate.js
      - name: Single-file build
        run: node apps/web/build-single.mjs dist/rabith-app.html
      - name: Launch readiness (report only)
        run: npm run preflight || true
